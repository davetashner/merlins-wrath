      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0d14;
        color: #e8e4d8;
        font-family: system-ui, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }
      #app > canvas {

      #app > :not(canvas) {
        position: relative;
        z-index: 1;
        margin: 1rem 1.5rem;
      }
      [data-testid='unsupported-browser'] {
        max-width: 40rem;
        line-height: 1.5;
      }
    </style>
