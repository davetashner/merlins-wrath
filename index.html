<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>The Vesper Bell</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0d14;
        color: #e8e4d8;
        font-family: system-ui, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }
      #app > canvas {
        position: absolute;
        inset: 0;
        z-index: 0;
      }
      #app > :not(canvas) {
        position: relative;
        z-index: 1;
        margin: 1rem 1.5rem;
      }
      #app > [data-testid='scene-hud'] {
        position: absolute;
        left: 0;
        bottom: 0;
        margin: 0.75rem 1rem;
        font:
          12px/1.4 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        color: #c9c4b6;
        text-shadow: 0 1px 2px #000;
        pointer-events: none;
      }
      [data-testid='scene-hud'] p {
        margin: 0;
      }
      [data-testid='scene-error'] {
        max-width: 40rem;
        padding: 1rem 1.25rem;
        background: #1b1f2bee;
        border: 1px solid #c4462f;
        line-height: 1.5;
      }
      [data-testid='scene-error'] a {
        color: #9cc2f0;
      }
      [data-testid='unsupported-browser'] {
        max-width: 40rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main id="app"><h1>The Vesper Bell</h1></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
