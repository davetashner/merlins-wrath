# Dependency updates (mw-e00.6): weekly, minor and patch grouped into one PR per ecosystem so they are
# cheap to review; majors arrive as their own PRs. Security updates are separate and immediate.
version: 2
updates:
  - package-ecosystem: npm # pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps
    ignore:
      # The repo pins Node 24 (.node-version, engine-strict); its types move with it, not ahead of it.
      # Lift when .node-version moves to the next LTS.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # typescript-eslint supports TypeScript < 6.1 only. Lift when it supports TypeScript 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: ci
