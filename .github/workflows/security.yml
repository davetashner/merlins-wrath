name: Security

# Secret scanning (mw-e00.5). Job name `secrets` is referenced by branch protection (mw-e00.10).
# GitHub secret scanning and push protection are enabled in the repository settings as well.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Every allowlist entry is explained
        run: node scripts/check-gitleaks-config-cli.ts
      - name: Install gitleaks (checksum-verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " ${tarball}\$" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Self-test (a fake token generated here must be caught and redacted)
        run: |
          dir=$(mktemp -d) && cd "$dir"
          git init -q && git config user.email ci@example.invalid && git config user.name ci
          token="ghp_$(LC_ALL=C tr -dc 'A-Za-z0-9' </dev/urandom | head -c 36)"
          echo "token = \"$token\"" > leak.txt && git add leak.txt && git commit -qm leak
          if out=$(gitleaks git --redact --no-banner --verbose --config "$GITHUB_WORKSPACE/.gitleaks.toml" . 2>&1); then
            echo "::error::gitleaks did not catch a GitHub token"; exit 1
          fi
          if grep -qF "$token" <<<"$out"; then echo "::error::gitleaks output echoed the secret"; exit 1; fi
          echo "Self-test passed: fake token caught and redacted."
      - name: Scan this PR's commits (full history on main)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          args=()
          if [ -n "$BASE" ]; then args+=("--log-opts=$BASE..$HEAD"); fi
          if gitleaks git "${args[@]}" --redact --no-banner --verbose --config .gitleaks.toml \
              --report-format json --report-path gitleaks.json .; then
            exit 0
          fi
          jq -r '.[] | "::error file=\(.File),line=\(.StartLine),title=Secret detected (\(.RuleID))::Commit \(.Commit[0:7]) adds a secret. Rotate it, then remove it from the branch history."' gitleaks.json
          exit 1
