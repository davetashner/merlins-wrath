name: CI

# Required checks reference these job names; keep them stable (mw-e00.3, mw-e00.10):
# lint, typecheck, unit, coverage-gate, coverage-ratchet, e2e-smoke (aggregates the e2e-shard jobs),
# build, beads-validate.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint # includes the src/sim determinism and layer-import rules
      - run: pnpm format:check

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test
      # Every content entry is exercised by a passing test (contract §3, mw-e00.18); reads the report
      # the Vitest content reporter wrote during pnpm test.
      - run: pnpm content:coverage
      # Loot tables across the world: references, cycles and depth, unique items guaranteed once
      # (mw-e18.2); unreferenced tables are warnings.
      - run: pnpm content:loot
      # Sim perf budgets asserted in vitest benchmark files (mw-e00.15 AC-6: mean step() ≤ 1 ms).
      - run: pnpm bench --reporter=verbose

  coverage-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Per-layer thresholds from coverage-layers.json; fails naming the file and metric.
      - run: pnpm test:coverage
      # coverage-exclusions.md is the only source of exclusions and glue-layer gaps.
      - run: pnpm coverage:exclusions
      # On main this is the baseline that PR ratchets download.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-summary
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
          if-no-files-found: warn
          retention-days: 90

  coverage-ratchet:
    if: github.event_name == 'pull_request'
    needs: coverage-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v8
        with:
          name: coverage-summary
          path: coverage
      - name: Download main's latest coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name coverage-summary --dir baseline \
              || echo "Could not download coverage from main run $run_id."
          fi
      # Falls back to the committed coverage-baseline.json with a warning annotation.
      - run: node scripts/coverage-ratchet-cli.ts

  # The suite runs in three shards so each stays well inside its timeout (mw-e00.34); the required
  # e2e-smoke check below passes only when every shard does.
  e2e-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-firefox-webkit
      # Firefox and WebKit run the audio testbed only (mw-e28.1 AC-6; see playwright.config.ts).
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium firefox webkit
      # Firefox only runs an AudioContext with a sound server; the runner has no sound card, so give
      # it PulseAudio with a null sink (mw-e28.1 AC-6).
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_null
          pactl set-default-sink ci_null
      - run: pnpm e2e --shard=${{ matrix.shard }}/3
      # The renderer boot smoke's first-frame screenshot, kept on every run (mw-e00.19). Only the
      # shard that runs the boot smoke has one.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: boot-smoke-screenshot-${{ matrix.shard }}
          path: test-results/**/boot-frame.png
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  e2e-smoke:
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every e2e shard passed
        run: test "${{ needs.e2e-shard.result }}" = success

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build

  # Runs on every PR, not behind a .beads/** path filter: a required check that is skipped by a path
  # filter blocks merging, and this takes seconds.
  beads-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: node scripts/validate-beads-cli.ts
