name: Publish backlog

on:
  push:
    branches: [main]
    paths: ['.beads/issues.jsonl', 'scripts/build-backlog-html.mjs', '.github/workflows/backlog-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}/backlog.html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: mkdir -p _site && node scripts/build-backlog-html.mjs .beads/issues.jsonl _site/backlog.html && cp _site/backlog.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
